name: Command Centre alerts
on:
  schedule:
    - cron: '17 18 * * *' # 02:17 Asia/Singapore (following day)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check with no writes/emails, or run configured alerts'
        type: choice
        default: dry-run
        options: [dry-run, run]
permissions:
  contents: read
concurrency:
  group: personal-command-centre-alerts
  cancel-in-progress: false
jobs:
  check:
    if: vars.PORTFOLIO_ALERT_UID != '' || vars.NOTION_PORTFOLIO_UID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - name: Wait for the US closing session
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          now=$(date +%s)
          local_day=$(TZ=Asia/Singapore date +%F)
          ready_at=$(TZ=Asia/Singapore date -d "$local_day 05:12" +%s)
          if (( now < ready_at )); then
            sleep "$((ready_at - now))"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install personal worker dependencies
        run: npm install --no-audit --no-fund
        working-directory: .github/scripts
      - name: Check personal command centre
        run: node .github/scripts/runCommandAlerts.mjs "--${ALERT_MODE}"
        env:
          ALERT_MODE: ${{ inputs.mode || 'run' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          PORTFOLIO_ALERT_UID: ${{ vars.PORTFOLIO_ALERT_UID || vars.NOTION_PORTFOLIO_UID }}
          PORTFOLIO_ALERT_OWNER_EMAIL: ${{ secrets.PORTFOLIO_ALERT_OWNER_EMAIL }}
          PORTFOLIO_ALERT_TO: ${{ secrets.PORTFOLIO_ALERT_TO }}
          PORTFOLIO_ALERT_FROM: ${{ secrets.PORTFOLIO_ALERT_FROM }}
          PORTFOLIO_ALERTS_ENABLED: ${{ vars.PORTFOLIO_ALERTS_ENABLED }}
          PORTFOLIO_ALERT_RESEND_KEY: ${{ secrets.PORTFOLIO_ALERT_RESEND_KEY }}
