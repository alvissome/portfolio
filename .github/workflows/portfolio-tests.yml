name: Portfolio calculation tests
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/portfolio-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run portfolio tests
        run: npm test
