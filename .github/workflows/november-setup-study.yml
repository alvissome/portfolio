name: November support setup study
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/november-setup-study.yml', '.github/scripts/november-study.mjs']
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
        working-directory: .github/scripts
      - run: node .github/scripts/november-study.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
